[package]
name = "benchwork"
default-run = "benchwork"
version = "0.16.0"
description = "Local-first research workspace"
authors = ["Ray Price"]
edition = "2021"

[lib]
name = "benchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
rand = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"

# Android has no Recycle Bin; deleted items go to the vault's own trash folder there.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Networking", "Networking_Sockets", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
