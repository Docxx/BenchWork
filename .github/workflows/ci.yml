# Checks every push and pull request: the same checks as `pnpm lint` and
# `pnpm test` locally, plus the Playwright flows and the relay's own tests.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.14.0
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (types, ESLint, Prettier)
        run: pnpm lint
      - name: Unit tests
        run: pnpm exec vitest run

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri checks that the web build folder exists when it compiles.
      - name: Placeholder web build
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: Playwright flows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium
      - name: Playwright flows
        run: pnpm test:e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  relay:
    name: Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Relay tests
        run: python -m unittest discover -s relay -p 'test_*.py' -v
